<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard - VSMETGUD Media Portal</title>
<style>
    :root {
        --bg: #0f172a;
        --card: #1e293b;
        --card-hover: #273347;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #2563eb;
        --green: #22c55e;
        --amber: #f59e0b;
        --red: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding-bottom: 60px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 18px 26px;
        background: #111827;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    header h1 {
        font-size: 20px;
        margin: 0;
    }

    header .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 2px;
    }

    header .actions button {
        background: var(--accent);
        border: none;
        color: white;
        padding: 9px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        margin-left: 8px;
    }

    header .actions button.secondary {
        background: #475569;
    }

    main {
        padding: 22px 26px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .stat-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 26px;
    }

    .stat-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
    }

    .stat-card .value {
        font-size: 28px;
        font-weight: 700;
    }

    .stat-card .label {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
    }

    section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 26px;
    }

    section h2 {
        margin: 0 0 14px 0;
        font-size: 17px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    section h2 .count {
        color: var(--muted);
        font-weight: 400;
        font-size: 13px;
    }

    .chart-wrap {
        position: relative;
        min-height: 340px;
    }

    .chart-wrap canvas {
        display: block;
        width: 100%;
    }

    .dashboard-filter-controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        align-items: end;
    }

    .dashboard-filter-controls label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
    }

    .dashboard-filter-controls input,
    .dashboard-filter-controls select,
    .dashboard-filter-controls button {
        min-width: 0;
        min-height: 40px;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #0f172a;
        color: var(--text);
        font: inherit;
    }

    .dashboard-filter-controls button {
        background: var(--accent);
        cursor: pointer;
        font-weight: 700;
    }

    .dashboard-filter-controls :focus-visible {
        outline: 2px solid #93c5fd;
        outline-offset: 2px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
    }

    th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
    }

    th {
        color: var(--muted);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    tr:hover td {
        background: var(--card-hover);
    }

    .file-link {
        color: #93c5fd;
        text-decoration: none;
        cursor: pointer;
        word-break: break-word;
    }

    .file-link:hover {
        text-decoration: underline;
    }

    .progress-bar-outer {
        width: 140px;
        height: 8px;
        border-radius: 6px;
        background: #0f172a;
        overflow: hidden;
        border: 1px solid var(--border);
    }

    .progress-bar-inner {
        height: 100%;
        background: var(--accent);
    }

    .progress-bar-inner.completed {
        background: var(--green);
    }

    .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 700;
    }

    .badge.completed { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge.in-progress { background: rgba(245,158,11,0.15); color: var(--amber); }

    .empty {
        color: var(--muted);
        padding: 24px;
        text-align: center;
    }

    .center-msg {
        text-align: center;
        padding: 80px 20px;
        color: var(--muted);
    }

    .center-msg button {
        margin-top: 16px;
        background: var(--accent);
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
    }
</style>
</head>
<body>

<header>
    <div>
        <h1>📊 My Dashboard</h1>
        <div class="sub" id="userLine">Loading your account...</div>
    </div>
    <div class="actions">
        <button
            id="refreshBtn"
            class="secondary"
            type="button"
            onclick="manualRefresh()">
            ↻ Refresh
        </button>
        <button class="secondary" onclick="window.close()">✖ Close</button>
    </div>
</header>

<main id="mainArea">
    <div class="center-msg">Loading your dashboard...</div>
</main>

<script>
let currentUsername = null;
let dashboardSourceData = { videoRows: [], fileRows: [] };

function getDashboardFilters() {
    try {
        return JSON.parse(localStorage.getItem("mediaPortalDashboardFilters") || "{}");
    } catch (error) {
        console.error("Unable to load dashboard filters:", error);
        return {};
    }
}

function filterDashboardRows(rows, query, type, period, timestampKey) {
    const now = Date.now();
    const typePatterns = {
        video: /\.(mp4|mkv|webm|mov|avi|m4v)$/i,
        audio: /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|wma|aiff?)$/i,
        image: /\.(png|jpe?g|gif|webp|bmp|svg|tiff?)$/i,
        document: /\.(pdf|docx?|xlsx?|pptx?|txt|csv|md)$/i
    };

    return rows.filter(row => {
        const path = String(row.filePath || "");
        const fileMatches = !query || path.toLowerCase().includes(query);
        const pattern = typePatterns[type];
        const typeMatches = !pattern || pattern.test(path);
        const accessedAt = new Date(row[timestampKey] || 0).getTime();
        const days = Number(period);
        const periodMatches = !days || (Number.isFinite(accessedAt) && now - accessedAt <= days * 86400000);
        return fileMatches && typeMatches && periodMatches;
    });
}

function saveDashboardFilters() {
    const filters = {
        query: document.getElementById("dashboardSearch")?.value || "",
        type: document.getElementById("dashboardFileType")?.value || "all",
        period: document.getElementById("dashboardPeriod")?.value || "all"
    };
    try {
        localStorage.setItem("mediaPortalDashboardFilters", JSON.stringify(filters));
    } catch (error) {
        console.error("Unable to save dashboard filters:", error);
    }

    const focusedId = document.activeElement?.id;
    const cursor = focusedId === "dashboardSearch"
        ? document.activeElement.selectionStart
        : null;
    renderDashboard(dashboardSourceData.videoRows, dashboardSourceData.fileRows);
    if (focusedId) {
        const replacement = document.getElementById(focusedId);
        replacement?.focus();
        if (cursor !== null && replacement) replacement.setSelectionRange(cursor, cursor);
    }
}

function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[s]));
}

function formatDateTime(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString(undefined, {
        year: "numeric", month: "short", day: "2-digit",
        hour: "2-digit", minute: "2-digit"
    });
}

function formatDuration(totalSeconds) {
    const s = Math.max(0, Math.round(Number(totalSeconds) || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${sec}s`;
    return `${sec}s`;
}

function fileName(path) {
    const parts = String(path).split("/");
    return parts[parts.length - 1];
}

/* Opens a file through the main portal window when possible (so the
   existing login/paywall checks and, for videos, resume-from-last-
   position all keep working). Falls back to a direct link. */
function openInPortal(file) {
    try {
        if (window.opener && !window.opener.closed && typeof window.opener.openFile === "function") {
            window.opener.focus();
            window.opener.openFile(file);
            return;
        }
    } catch (e) {}
    window.open("/media/" + encodeURIComponent(file), "_blank");
}

async function fetchJson(url) {
    const res = await fetch(url, { credentials: "include", cache: "no-store" });
    if (res.status === 401) {
        const err = new Error("unauthorized");
        err.unauthorized = true;
        throw err;
    }
    return res.json();
}

// ---------------------------------------------------------
// LOCAL RESILIENCE CACHE
//
// The dashboard re-fetches everything from the server on every
// load/refresh, so a plain browser refresh already shows current
// data - it never depends on in-page state. This cache exists for
// the case the SERVER itself is briefly unreachable (pod restarting,
// deployment rolling, network blip): instead of a blank error
// screen, the last known-good snapshot for THIS username is shown
// with a clear "reconnecting" banner, and it keeps retrying quietly
// in the background until the server answers again.
// ---------------------------------------------------------
let retryTimer = null;

function cacheKey(username) {
    return `mediaPortalDashboardCache:${username}`;
}

function loadLocalRecords(type, username) {
    try {
        const key = `mediaPortal${type}:${String(username || "").toLowerCase()}`;
        const records = JSON.parse(localStorage.getItem(key) || "{}");
        return Object.values(records).filter(record =>
            record && typeof record.filePath === "string"
        );
    } catch (err) {
        console.warn(`Unable to load local ${type.toLowerCase()}:`, err);
        return [];
    }
}

function mergeVideoProgress(serverRows, username) {
    const rowsByPath = new Map(serverRows.map(row => [row.filePath, row]));

    loadLocalRecords("VideoProgress", username).forEach(localRow => {
        const serverRow = rowsByPath.get(localRow.filePath);
        if (
            !serverRow ||
            new Date(localRow.lastAccessedAt).getTime() >
                new Date(serverRow.lastAccessedAt).getTime()
        ) {
            rowsByPath.set(localRow.filePath, { ...serverRow, ...localRow });
        }
    });

    return Array.from(rowsByPath.values());
}

function mergeFileHistory(serverRows, username) {
    const rowsByPath = new Map(serverRows.map(row => [row.filePath, row]));

    loadLocalRecords("FileHistory", username).forEach(localRow => {
        const serverRow = rowsByPath.get(localRow.filePath);
        if (!serverRow) {
            rowsByPath.set(localRow.filePath, localRow);
            return;
        }

        rowsByPath.set(localRow.filePath, {
            ...serverRow,
            firstAccessed: new Date(localRow.firstAccessed) < new Date(serverRow.firstAccessed)
                ? localRow.firstAccessed
                : serverRow.firstAccessed,
            lastAccessed: new Date(localRow.lastAccessed) > new Date(serverRow.lastAccessed)
                ? localRow.lastAccessed
                : serverRow.lastAccessed,
            accessCount: Math.max(
                Number(localRow.accessCount) || 0,
                Number(serverRow.accessCount) || 0
            )
        });
    });

    return Array.from(rowsByPath.values())
        .sort((a, b) => new Date(b.lastAccessed) - new Date(a.lastAccessed));
}

function mergeWithSavedSnapshot(videoRows, fileRows, username) {
    const snapshot = loadSnapshot(username);
    if (!snapshot) return { videoRows, fileRows };

    const videosByPath = new Map(videoRows.map(row => [row.filePath, row]));
    snapshot.videoRows.forEach(savedRow => {
        const current = videosByPath.get(savedRow.filePath);
        const savedTime = new Date(savedRow.lastAccessedAt || 0).getTime();
        const currentTime = new Date(current?.lastAccessedAt || 0).getTime();
        if (!current || (Number.isFinite(savedTime) && (!Number.isFinite(currentTime) || savedTime > currentTime))) {
            videosByPath.set(savedRow.filePath, { ...current, ...savedRow });
        }
    });

    const filesByPath = new Map(fileRows.map(row => [row.filePath, row]));
    snapshot.fileRows.forEach(savedRow => {
        const current = filesByPath.get(savedRow.filePath);
        if (!current) {
            filesByPath.set(savedRow.filePath, savedRow);
            return;
        }
        const savedLast = new Date(savedRow.lastAccessed || 0).getTime();
        const currentLast = new Date(current.lastAccessed || 0).getTime();
        const latest = Number.isFinite(savedLast) && (!Number.isFinite(currentLast) || savedLast > currentLast)
            ? savedRow
            : current;
        const firstTimes = [savedRow.firstAccessed, current.firstAccessed]
            .map(value => ({ value, time: new Date(value || 0).getTime() }))
            .filter(entry => Number.isFinite(entry.time));
        const firstAccessed = firstTimes.length
            ? firstTimes.reduce((earliest, entry) => entry.time < earliest.time ? entry : earliest).value
            : latest.firstAccessed;
        filesByPath.set(savedRow.filePath, {
            ...current,
            ...latest,
            firstAccessed,
            accessCount: Math.max(
                Number(savedRow.accessCount) || 0,
                Number(current.accessCount) || 0
            )
        });
    });

    return {
        videoRows: Array.from(videosByPath.values()),
        fileRows: Array.from(filesByPath.values())
    };
}

function saveSnapshot(username, videoRows, fileRows) {
    try {
        localStorage.setItem(cacheKey(username), JSON.stringify({
            videoRows, fileRows, savedAt: new Date().toISOString()
        }));
        return true;
    } catch (error) {
        console.error("Unable to save the dashboard recovery snapshot:", error);
        return false;
    }
}

function loadSnapshot(username) {
    try {
        const raw = localStorage.getItem(cacheKey(username));
        if (!raw) return null;
        const snapshot = JSON.parse(raw);
        if (
            !snapshot ||
            !Array.isArray(snapshot.videoRows) ||
            !Array.isArray(snapshot.fileRows) ||
            typeof snapshot.savedAt !== "string"
        ) {
            console.error("Saved dashboard recovery data has an unsupported shape.");
            return null;
        }
        return snapshot;
    } catch (error) {
        console.error("Unable to read the dashboard recovery snapshot:", error);
        return null;
    }
}

function showReconnectBanner(savedAt) {
    let banner = document.getElementById("reconnectBanner");
    if (!banner) {
        banner = document.createElement("div");
        banner.id = "reconnectBanner";
        banner.style.cssText =
            "background:#7c2d12;color:#fed7aa;padding:10px 20px;font-size:13.5px;" +
            "text-align:center;position:sticky;top:66px;z-index:9;";
        document.body.insertBefore(banner, document.getElementById("mainArea"));
    }
    banner.textContent =
        `⚠ Can't reach the server right now - showing data saved locally on ${formatDateTime(savedAt)}. Retrying...`;
}

function hideReconnectBanner() {
    const banner = document.getElementById("reconnectBanner");
    if (banner) banner.remove();
}

function scheduleRetry() {
    if (retryTimer) return;
    retryTimer = setTimeout(() => {
        retryTimer = null;
        refreshAll(true);
    }, 10000);
}

let refreshInProgress = false;
let dashboardHasRendered = false;

function restoreDashboardSnapshotBeforeConnecting() {
    const cachedUsername = getLastKnownUsername();
    if (!cachedUsername) return;
    const snapshot = loadSnapshot(cachedUsername);
    if (!snapshot) return;

    currentUsername = cachedUsername;
    document.getElementById("userLine").textContent =
        `Last known account: ${cachedUsername} (restored locally; checking server...)`;
    renderDashboard(snapshot.videoRows, snapshot.fileRows);
    dashboardHasRendered = true;
    showReconnectBanner(snapshot.savedAt);
}

async function manualRefresh() {
    if (refreshInProgress) return;
    refreshInProgress = true;

    const btn = document.getElementById("refreshBtn");

    try {
        btn.disabled = true;
        btn.textContent = "Refreshing...";

        await refreshAll(false);

        console.log(
            "Dashboard refresh triggered:",
            new Date().toLocaleString()
        );
    } finally {
        refreshInProgress = false;
        btn.disabled = false;
        btn.textContent = "↻ Refresh";
    }
}

async function refreshAll(isBackgroundRetry) {
    if (!dashboardHasRendered) {
        restoreDashboardSnapshotBeforeConnecting();
    }

    try {
        const me = await fetchJson("/api/me");
        currentUsername = me.user.username;
        try { localStorage.setItem("mediaPortalLastUsername", currentUsername); } catch (e) {}
        document.getElementById("userLine").textContent =
            `Signed in as ${me.user.name || me.user.username} - viewing history is private to this account`;

        const [progressData, fileActivityData] = await Promise.all([
            fetchJson("/api/media-progress"),
            fetchJson("/api/file-activity-summary")
        ]);

        const cachedRows = mergeWithSavedSnapshot(
            mergeVideoProgress(progressData.rows || [], currentUsername),
            mergeFileHistory(fileActivityData.rows || [], currentUsername),
            currentUsername
        );
        const videoRows = cachedRows.videoRows;
        const fileRows = cachedRows.fileRows;

        hideReconnectBanner();
        renderDashboard(videoRows, fileRows);
        dashboardHasRendered = true;
        if (!saveSnapshot(currentUsername, videoRows, fileRows)) {
            showSnapshotSaveWarning();
        } else {
            hideSnapshotSaveWarning();
        }

    } catch (err) {
        if (err.unauthorized) {
            hideReconnectBanner();
            document.getElementById("mainArea").innerHTML = `
                <div class="center-msg">
                    You need to be logged in to the portal to view your dashboard.<br>
                    <button onclick="window.location.href='/'">Go to Portal Login</button>
                </div>
            `;
            document.getElementById("userLine").textContent = "Not signed in";
            dashboardHasRendered = false;
            return;
        }

        // Network/server-down failure (pod restarting, deployment rolling, etc.)
        console.error("Dashboard load failed, will retry:", err);

        const cachedUsername = currentUsername || getLastKnownUsername();
        const snapshot = cachedUsername ? loadSnapshot(cachedUsername) : null;

        if (snapshot) {
            if (!dashboardHasRendered || !isBackgroundRetry) {
                document.getElementById("userLine").textContent =
                    `Last known account: ${cachedUsername} (offline)`;
                renderDashboard(snapshot.videoRows, snapshot.fileRows);
                dashboardHasRendered = true;
            }
            showReconnectBanner(snapshot.savedAt);
        } else if (!dashboardHasRendered) {
            document.getElementById("mainArea").innerHTML = `
                <div class="center-msg">
                    Can't reach the server right now and no locally saved dashboard data is
                    available yet for this browser. Retrying automatically...
                </div>
            `;
        }

        scheduleRetry();
    }
}

function showSnapshotSaveWarning() {
    let warning = document.getElementById("snapshotSaveWarning");
    if (!warning) {
        warning = document.createElement("div");
        warning.id = "snapshotSaveWarning";
        warning.style.cssText =
            "background:#78350f;color:#fef3c7;padding:9px 16px;text-align:center;font-size:13px;";
        document.body.insertBefore(warning, document.getElementById("mainArea"));
    }
    warning.textContent =
        "⚠ Dashboard refreshed, but this browser could not save a recovery snapshot. Download a backup or free browser storage.";
}

function hideSnapshotSaveWarning() {
    document.getElementById("snapshotSaveWarning")?.remove();
}

function getLastKnownUsername() {
    try {
        return localStorage.getItem("mediaPortalLastUsername") || null;
    } catch (e) {
        return null;
    }
}

function renderDashboard(videoRows, fileRows) {
    dashboardSourceData = { videoRows, fileRows };
    const filters = getDashboardFilters();
    const query = String(filters.query || "").trim().toLowerCase();
    const type = ["all", "video", "audio", "image", "document"].includes(filters.type)
        ? filters.type
        : "all";
    const period = ["all", "7", "30"].includes(String(filters.period))
        ? String(filters.period)
        : "all";
    videoRows = type === "all" || type === "video"
        ? filterDashboardRows(videoRows, query, "video", period, "lastAccessedAt")
        : [];
    fileRows = filterDashboardRows(fileRows, query, type, period, "lastAccessed");

    const inProgress = videoRows
        .filter(r => r.status !== "completed")
        .sort((a, b) => new Date(b.lastAccessedAt) - new Date(a.lastAccessedAt));

    const completed = videoRows
        .filter(r => r.status === "completed")
        .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));

    const totalAccessedFiles = fileRows.length;

    document.getElementById("mainArea").innerHTML = `
        <section aria-labelledby="dashboardFilterTitle">
            <h2 id="dashboardFilterTitle">🔎 Find files and history</h2>
            <div class="dashboard-filter-controls">
                <label>Search files
                    <input id="dashboardSearch" type="search" placeholder="Search by file name or path" value="${escapeHtml(filters.query || "")}">
                </label>
                <label>File type
                    <select id="dashboardFileType">
                        <option value="all">All files</option>
                        <option value="video">Videos</option>
                        <option value="audio">Audio</option>
                        <option value="image">Images</option>
                        <option value="document">Documents</option>
                    </select>
                </label>
                <label>Recently accessed
                    <select id="dashboardPeriod">
                        <option value="all">Any time</option>
                        <option value="7">Last 7 days</option>
                        <option value="30">Last 30 days</option>
                    </select>
                </label>
                <button type="button" id="clearDashboardFilters">Clear filters</button>
            </div>
        </section>
        <div class="stat-row">
            <div class="stat-card">
                <div class="value">${videoRows.length}</div>
                <div class="label">Videos Tracked</div>
            </div>
            <div class="stat-card">
                <div class="value" style="color:var(--amber)">${inProgress.length}</div>
                <div class="label">In Progress</div>
            </div>
            <div class="stat-card">
                <div class="value" style="color:var(--green)">${completed.length}</div>
                <div class="label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="value">${totalAccessedFiles}</div>
                <div class="label">Total Files Accessed</div>
            </div>
        </div>

        <section>
            <h2>📈 Progress by Video <span class="count">${videoRows.length} tracked</span></h2>
            <div class="chart-wrap">
                <canvas id="progressChartCanvas"></canvas>
            </div>
        </section>

        <section>
            <h2>⏳ Remaining Time to Completion <span class="count">${inProgress.length} incomplete video${inProgress.length === 1 ? "" : "s"}</span></h2>
            <div class="chart-wrap">
                <canvas id="remainingChartCanvas"></canvas>
            </div>
        </section>

        <section>
            <h2>▶ Incomplete Videos - Click to Resume <span class="count">${inProgress.length} pending completion</span></h2>
            ${renderContinueTable(inProgress)}
        </section>

        <section>
            <h2>✅ Completed Videos <span class="count">${completed.length}</span></h2>
            ${renderCompletedTable(completed)}
        </section>

        <section>
            <h2>🕒 Last Accessed Files - Click to Open <span class="count">${fileRows.length} files (any type), newest first</span></h2>
            ${renderFileActivityTable(fileRows)}
        </section>
    `;

    document.getElementById("dashboardFileType").value = type;
    document.getElementById("dashboardPeriod").value = period;
    document.getElementById("dashboardSearch").addEventListener("input", saveDashboardFilters);
    document.getElementById("dashboardFileType").addEventListener("change", saveDashboardFilters);
    document.getElementById("dashboardPeriod").addEventListener("change", saveDashboardFilters);
    document.getElementById("clearDashboardFilters").addEventListener("click", () => {
        document.getElementById("dashboardSearch").value = "";
        document.getElementById("dashboardFileType").value = "all";
        document.getElementById("dashboardPeriod").value = "all";
        saveDashboardFilters();
    });

    try {
    renderChart(videoRows);
} catch (err) {
    console.error("Progress chart rendering failed:", err);
}

    try {
        renderRemainingChart(inProgress);
    } catch (err) {
        console.error("Remaining-time chart rendering failed:", err);
    }
}

function renderContinueTable(rows) {
    if (rows.length === 0) {
        return `<div class="empty">Nothing in progress right now - videos you start watching will show up here.</div>`;
    }

    const body = rows.map(r => {
        const remaining = Math.max(0, r.durationSeconds - r.positionSeconds);
        const pct = Math.round(r.percent);
        return `
            <tr>
                <td><a class="file-link" onclick="openInPortal('${escapeAttr(r.filePath)}')">${escapeHtml(fileName(r.filePath))}</a></td>
                <td>
                    <div class="progress-bar-outer">
                        <div class="progress-bar-inner" style="width:${pct}%"></div>
                    </div>
                    ${pct}%
                </td>
                <td>${formatDuration(remaining)} left</td>
                <td>${formatDateTime(r.startedAt)}</td>
                <td>${formatDateTime(r.lastAccessedAt)}</td>
                <td><span class="badge in-progress">IN PROGRESS</span></td>
            </tr>
        `;
    }).join("");

    return `
        <table>
            <thead>
                <tr>
                    <th>File</th>
                    <th>% Complete</th>
                    <th>Remaining Time</th>
                    <th>Started</th>
                    <th>Last Accessed</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>${body}</tbody>
        </table>
    `;
}

function renderCompletedTable(rows) {
    if (rows.length === 0) {
        return `<div class="empty">No completed videos yet.</div>`;
    }

    const body = rows.map(r => `
        <tr>
            <td><a class="file-link" onclick="openInPortal('${escapeAttr(r.filePath)}')">${escapeHtml(fileName(r.filePath))}</a></td>
            <td>${formatDuration(r.durationSeconds)}</td>
            <td>${formatDateTime(r.startedAt)}</td>
            <td>${formatDateTime(r.completedAt)}</td>
            <td><span class="badge completed">COMPLETED</span></td>
        </tr>
    `).join("");

    return `
        <table>
            <thead>
                <tr>
                    <th>File</th>
                    <th>Total Length</th>
                    <th>Started</th>
                    <th>Completed On</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>${body}</tbody>
        </table>
    `;
}

function renderFileActivityTable(rows) {
    if (rows.length === 0) {
        return `<div class="empty">No file access recorded yet - files you open or download will show up here.</div>`;
    }

    const body = rows.map(r => `
        <tr>
            <td><a class="file-link" onclick="openInPortal('${escapeAttr(r.filePath)}')">${escapeHtml(fileName(r.filePath))}</a></td>
            <td>${formatDateTime(r.firstAccessed)}</td>
            <td>${formatDateTime(r.lastAccessed)}</td>
            <td>${r.accessCount}</td>
        </tr>
    `).join("");

    return `
        <table>
            <thead>
                <tr>
                    <th>File</th>
                    <th>First Accessed</th>
                    <th>Last Accessed</th>
                    <th>Times Opened</th>
                </tr>
            </thead>
            <tbody>${body}</tbody>
        </table>
    `;
}

function escapeAttr(str) {
    return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function renderHorizontalBarChart(canvas, {
    labels,
    values,
    colors,
    maxValue,
    axisLabel,
    emptyText
}) {
    if (!canvas) return;

    const ctx = canvas.getContext("2d");
    if (!ctx) {
        console.error("Unable to render dashboard chart: canvas context is unavailable.");
        return;
    }

    const width = Math.max(canvas.clientWidth, 320);
    const rowHeight = 34;
    const height = Math.max(340, labels.length * rowHeight + 70);
    const pixelRatio = window.devicePixelRatio || 1;

    canvas.style.height = `${height}px`;
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.font = "12px Segoe UI, Arial, sans-serif";
    ctx.textBaseline = "middle";

    if (labels.length === 0) {
        ctx.fillStyle = "#94a3b8";
        ctx.textAlign = "left";
        ctx.font = "14px Segoe UI, Arial, sans-serif";
        ctx.fillText(emptyText, 20, 30);
        return;
    }

    const left = Math.min(230, Math.max(130, width * 0.38));
    const right = 28;
    const top = 24;
    const bottom = 42;
    const plotWidth = Math.max(40, width - left - right);
    const plotHeight = height - top - bottom;
    const safeMax = maxValue > 0 ? maxValue : 1;

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    for (let tick = 0; tick <= 4; tick += 1) {
        const x = left + plotWidth * tick / 4;
        const value = safeMax * tick / 4;
        ctx.strokeStyle = "#334155";
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, top + plotHeight);
        ctx.stroke();
        ctx.fillStyle = "#94a3b8";
        ctx.fillText(`${Number(value.toFixed(1))}${axisLabel === "%" ? "%" : ""}`, x, height - 20);
    }

    ctx.fillStyle = "#94a3b8";
    ctx.fillText(axisLabel, left + plotWidth / 2, height - 4);

    labels.forEach((label, index) => {
        const centerY = top + plotHeight * (index + 0.5) / labels.length;
        const value = Math.max(0, Number(values[index]) || 0);
        const barWidth = plotWidth * Math.min(value, safeMax) / safeMax;
        const maxLabelWidth = left - 20;
        let displayLabel = String(label);
        while (displayLabel.length > 3 && ctx.measureText(`${displayLabel}...`).width > maxLabelWidth) {
            displayLabel = displayLabel.slice(0, -1);
        }
        if (displayLabel !== label) displayLabel += "...";

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#e2e8f0";
        ctx.fillText(displayLabel, left - 12, centerY);
        ctx.fillStyle = colors[index];
        ctx.fillRect(left, centerY - 8, barWidth, 16);
    });
}

function renderRemainingChart(inProgressRows) {
    const sorted = [...inProgressRows].sort((a, b) => {
        const remA = a.durationSeconds - a.positionSeconds;
        const remB = b.durationSeconds - b.positionSeconds;
        return remA - remB;
    });
    const minutesRemaining = sorted.map(row =>
        Math.round(Math.max(0, row.durationSeconds - row.positionSeconds) / 60 * 10) / 10
    );

    renderHorizontalBarChart(document.getElementById("remainingChartCanvas"), {
        labels: sorted.map(row => fileName(row.filePath)),
        values: minutesRemaining,
        colors: sorted.map(() => "#f59e0b"),
        maxValue: Math.max(...minutesRemaining, 0),
        axisLabel: "Minutes remaining",
        emptyText: "Nothing in progress - nothing left to complete."
    });
}

function renderChart(rows) {
    const sorted = [...rows].sort((a, b) => new Date(b.lastAccessedAt) - new Date(a.lastAccessedAt));

    renderHorizontalBarChart(document.getElementById("progressChartCanvas"), {
        labels: sorted.map(row => fileName(row.filePath)),
        values: sorted.map(row => Math.round(row.percent)),
        colors: sorted.map(row => row.status === "completed" ? "#22c55e" : "#2563eb"),
        maxValue: 100,
        axisLabel: "%",
        emptyText: "No videos watched yet."
    });
}

refreshAll();

// Refresh the dashboard every 10 seconds.
setInterval(() => {
    refreshAll(true);
}, 10000);
