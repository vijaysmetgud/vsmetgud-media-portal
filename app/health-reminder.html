<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Reminder</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #04131d, #0f172a 50%, #111827);
      color: #e2e8f0;
      min-height: 100vh;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .panel {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 22px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.4);
      padding: 26px 20px;
    }

    h1 {
      text-align: center;
      margin: 0 0 18px;
      font-size: clamp(28px, 5vw, 42px);
      color: #f8fafc;
    }

    .healthReminderRadios {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .healthRadio {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .healthRadio input {
      width: auto;
      margin: 0;
      accent-color: #34d399;
    }

    .healthReminderList {
      display: grid;
      gap: 14px;
    }

    .healthReminderItem {
      background: rgba(2, 6, 23, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 16px;
      padding: 16px 18px;
    }

    .tipTime {
      display: inline-block;
      background: #14532d;
      color: #bbf7d0;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .healthReminderItem strong {
      display: block;
      color: #fef3c7;
      margin-bottom: 6px;
      font-size: 20px;
    }

    .healthReminderItem p {
      margin: 0;
      line-height: 1.6;
      color: #e2e8f0;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <h1>💚 Health Reminder</h1>

      <div class="healthReminderRadios" aria-label="Health reminder function selector">
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="all" checked>
          <span>All</span>
        </label>
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="walk">
          <span>Walk</span>
        </label>
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="run">
          <span>Run</span>
        </label>
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="exercise">
          <span>Exercise</span>
        </label>
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="tea">
          <span>Tea Break</span>
        </label>
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="lunch">
          <span>Lunch Break</span>
        </label>
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="sitting">
          <span>Prolonged Sitting</span>
        </label>
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="office">
          <span>Office Leave</span>
        </label>
        <label class="healthRadio">
          <input type="radio" name="healthReminderType" value="compliment">
          <span>Compliment</span>
        </label>
      </div>

      <div id="healthReminderList" class="healthReminderList"></div>
    </div>
  </div>

  <script>
    const healthTipSchedule = [
      { id: 'walk', label: 'Walk', time: '09:15', message: 'Walk for 10 minutes now to refresh your energy and improve focus.' },
      { id: 'exercise', label: 'Exercise', time: '12:30', message: 'Do a light exercise or stretch break to keep your body active.' },
      { id: 'tea', label: 'Tea Break', time: '15:00', message: 'Tea break time: stand up, hydrate, and take a short reset.' },
      { id: 'lunch', label: 'Lunch Break', time: '13:00', message: 'It is lunch break time. Eat mindfully and take a short rest.' },
      { id: 'sitting', label: 'Prolonged Sitting', time: '11:00', message: 'You have been sitting for long. Stand up, stretch your legs, and walk for 2 minutes.' },
      { id: 'office', label: 'Office Leaving Time', time: '18:00', message: 'Office leaving time. Wrap up your work and finish your day calmly.' },
      { id: 'compliment', label: 'Compliment', time: '17:30', message: 'Excellent work today. Keep up the good effort—you are doing great!' },
      { id: 'run', label: 'Run', time: '18:30', message: 'Evening run or brisk walk will help keep you energetic and healthy.' }
    ];

    function getSelectedHealthReminderType() {
      const selected = document.querySelector('input[name="healthReminderType"]:checked');
      return selected ? selected.value : 'all';
    }

    function renderHealthTips() {
      const selectedType = getSelectedHealthReminderType();
      const filteredTips = selectedType === 'all'
        ? healthTipSchedule
        : healthTipSchedule.filter((tip) => tip.id === selectedType);

      document.getElementById('healthReminderList').innerHTML = filteredTips.map((tip) => `
        <div class="healthReminderItem">
          <span class="tipTime">${tip.time}</span>
          <strong>${tip.label}</strong>
          <p>${tip.message}</p>
        </div>
      `).join('');
    }

    document.querySelectorAll('input[name="healthReminderType"]').forEach((radio) => {
      radio.addEventListener('change', renderHealthTips);
    });

    renderHealthTips();
  </script>
</body>
</html>
