<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Reminder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f97316, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.1rem;
            color: #cbd5e1;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 8px;
            color: #fb923c;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(249, 115, 22, 0.2);
            border-color: rgba(249, 115, 22, 0.5);
        }

        .controls {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .controls label {
            color: #cbd5e1;
            font-weight: 600;
            margin-right: 8px;
        }

        .controls input,
        .controls select {
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 6px;
            color: #f8fafc;
            font-size: 0.95rem;
        }

        .controls input:focus,
        .controls select:focus {
            outline: none;
            border-color: rgba(249, 115, 22, 0.6);
            background: rgba(30, 41, 59, 0.8);
        }

        .controls button {
            padding: 10px 18px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(249, 115, 22, 0.3);
        }

        .reminders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .reminder-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .reminder-card:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(249, 115, 22, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.2);
        }

        .reminder-card.active {
            border-color: rgba(34, 197, 94, 0.6);
            background: rgba(34, 197, 94, 0.1);
        }

        .reminder-card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .reminder-card .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .reminder-card .description {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .reminder-card .time {
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fb923c;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .reminder-card .toggle-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.2);
            border: 1px solid rgba(148, 163, 184, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .reminder-card.active .toggle-btn {
            background: rgba(34, 197, 94, 0.3);
            border-color: rgba(34, 197, 94, 0.6);
            color: #86efac;
        }

        .stats {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stats h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .stat-item {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 15px;
        }

        .stat-item .label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fb923c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-button">← Back to Portal</a>
            <h1>💪 Health Reminder</h1>
            <p>Stay healthy and productive with timely reminders</p>
        </header>

        <div class="controls">
            <label for="reminderInterval">Interval (minutes):</label>
            <input type="number" id="reminderInterval" min="5" max="120" value="30">
            <button onclick="updateReminderInterval()">Update Interval</button>
            <button onclick="toggleAllReminders()" style="margin-left: auto;">Enable All</button>
        </div>

        <div class="reminders-grid" id="remindersGrid"></div>

        <div class="stats">
            <h2>📊 Today's Health Stats</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="label">Reminders Shown</div>
                    <div class="value" id="reminderCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">Active Reminders</div>
                    <div class="value" id="activeCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">Last Reminder</div>
                    <div class="value" id="lastReminder" style="font-size: 0.9rem;">None</div>
                </div>
                <div class="stat-item">
                    <div class="label">Next Reminder In</div>
                    <div class="value" id="nextReminder">--:--</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const reminders = [
            {
                id: 'walk',
                title: '🚶 Walk',
                icon: '🚶‍♂️',
                description: 'Take a 5-minute walk to stay active',
                defaultTime: '09:00',
                active: true
            },
            {
                id: 'run',
                title: '🏃 Run',
                icon: '🏃‍♂️',
                description: 'Go for a quick jog or run session',
                defaultTime: '06:00',
                active: true
            },
            {
                id: 'exercise',
                title: '💪 Exercise',
                icon: '🏋️',
                description: 'Do some light exercise or stretching',
                defaultTime: '12:00',
                active: true
            },
            {
                id: 'sitting',
                title: '⚠️ Prolonged Sitting Alert',
                icon: '🪑',
                description: 'You have been sitting too long, stand up!',
                defaultTime: '14:00',
                active: true
            },
            {
                id: 'tea',
                title: '☕ Tea Break',
                icon: '☕',
                description: 'Take a tea break and relax',
                defaultTime: '10:30',
                active: true
            },
            {
                id: 'lunch',
                title: '🍽️ Lunch Break',
                icon: '🍽️',
                description: 'Time for lunch, take a break',
                defaultTime: '13:00',
                active: true
            },
            {
                id: 'leaving',
                title: '🚪 Office Leaving Time',
                icon: '🚗',
                description: 'It\'s time to leave the office',
                defaultTime: '18:00',
                active: true
            },
            {
                id: 'compliment',
                title: '😊 Wellness Compliment',
                icon: '✨',
                description: 'You are doing great! Keep it up!',
                defaultTime: '17:00',
                active: true
            }
        ];

        let reminderCount = 0;
        let lastReminderTime = null;

        function renderReminders() {
            const grid = document.getElementById('remindersGrid');
            grid.innerHTML = '';

            reminders.forEach(reminder => {
                const card = document.createElement('div');
                card.className = `reminder-card ${reminder.active ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="toggle-btn" onclick="toggleReminder('${reminder.id}')">
                        ${reminder.active ? '✓' : ''}
                    </div>
                    <div class="icon">${reminder.icon}</div>
                    <h3>${reminder.title}</h3>
                    <div class="description">${reminder.description}</div>
                    <div class="time">${reminder.defaultTime}</div>
                `;
                card.onclick = (e) => {
                    if (!e.target.closest('.toggle-btn')) {
                        toggleReminder(reminder.id);
                    }
                };
                grid.appendChild(card);
            });

            updateStats();
        }

        function toggleReminder(id) {
            const reminder = reminders.find(r => r.id === id);
            if (reminder) {
                reminder.active = !reminder.active;
                renderReminders();
            }
        }

        function toggleAllReminders() {
            const allActive = reminders.every(r => r.active);
            reminders.forEach(r => r.active = !allActive);
            renderReminders();
        }

        function updateReminderInterval() {
            const interval = document.getElementById('reminderInterval').value;
            localStorage.setItem('healthReminderInterval', interval);
            alert(`Reminder interval updated to ${interval} minutes`);
        }

        function updateStats() {
            const activeCount = reminders.filter(r => r.active).length;
            document.getElementById('activeCount').textContent = activeCount;
            document.getElementById('reminderCount').textContent = reminderCount;

            if (lastReminderTime) {
                document.getElementById('lastReminder').textContent = new Date(lastReminderTime).toLocaleTimeString();
            }

            // Calculate next reminder
            const now = new Date();
            const upcomingReminder = reminders
                .filter(r => r.active)
                .map(r => {
                    const [hours, minutes] = r.defaultTime.split(':').map(Number);
                    const reminderTime = new Date();
                    reminderTime.setHours(hours, minutes, 0);
                    if (reminderTime < now) {
                        reminderTime.setDate(reminderTime.getDate() + 1);
                    }
                    return reminderTime;
                })
                .sort((a, b) => a - b)[0];

            if (upcomingReminder) {
                const diff = upcomingReminder - now;
                const hours = Math.floor(diff / 3600000);
                const mins = Math.floor((diff % 3600000) / 60000);
                document.getElementById('nextReminder').textContent = `${hours}h ${mins}m`;
            }
        }

        function showReminder(reminder) {
            if (!reminder.active) return;

            reminderCount++;
            lastReminderTime = new Date();

            // Show desktop notification if permitted
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(reminder.title, {
                    body: reminder.description,
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + reminder.icon + '</text></svg>'
                });
            }

            // Show an alert as fallback
            alert(`${reminder.icon} ${reminder.title}\n${reminder.description}`);

            updateStats();
        }

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Initialize
        renderReminders();
        updateStats();

        // Update stats every minute
        setInterval(updateStats, 60000);
    </script>
</body>
</html>
