<!-- =========================================================
     EDIT HEALTH REMINDER BUTTON
     ========================================================= -->

<button
    type="button"
    class="healthEditMainBtn"
    onclick="openHealthReminderEditor()">
    ✏️ Edit Health Reminder
</button>


<!-- =========================================================
     EDIT HEALTH REMINDER SELECTOR
     ========================================================= -->

<div
    id="healthReminderEditor"
    style="display:none;">

    <div class="health-editor-box">

        <h2>✏️ Edit Health Reminder</h2>

        <div id="healthReminderRadioList"></div>

        <button
            type="button"
            class="healthEditSelectedBtn"
            onclick="editSelectedHealthReminder()">
            ✏️ Edit Selected Reminder
        </button>

        <button
            type="button"
            onclick="closeHealthReminderEditor()">
            Close
        </button>

    </div>

</div>


<!-- HEALTH REMINDER JAVASCRIPT -->
<script src="health-reminder.js"></script>

</body>
</html>
