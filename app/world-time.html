<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Time Zones</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-soft: rgba(30, 41, 59, 0.9);
      --primary: #60a5fa;
      --accent: #34d399;
      --text: #e2e8f0;
      --muted: #cbd5e1;
      --border: rgba(148, 163, 184, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020817, #0f172a 35%, #111827);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    h1 {
      text-align: center;
      margin: 0 0 18px;
      color: #f8fafc;
      font-size: clamp(28px, 4vw, 42px);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.4);
      padding: 20px;
      margin-bottom: 22px;
    }

    .timezoneRadios {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .timezoneRadio {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .timezoneRadio input {
      margin: 0;
      accent-color: var(--accent);
      width: auto;
    }

    .mapPanel {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
      align-items: stretch;
    }

    .mapWrap {
      background: rgba(9, 16, 31, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      min-height: 360px;
      position: relative;
      overflow: hidden;
    }

    .mapSvg {
      width: 100%;
      height: 100%;
      min-height: 320px;
      display: block;
      border-radius: 12px;
      background:
        radial-gradient(circle at 30% 20%, rgba(59, 130, 246, 0.18), transparent 30%),
        linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(15, 23, 42, 0.05));
    }

    .cityMarker {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #facc15;
      border: 2px solid #fff;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.8);
      transform: translate(-50%, -50%);
    }

    .cityMarker.active {
      background: var(--accent);
      box-shadow: 0 0 18px rgba(52, 211, 153, 0.9);
    }

    .cityLabel {
      position: absolute;
      transform: translate(-50%, -110%);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
    }

    .timeCard {
      background: var(--panel-soft);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .timeCard h2 {
      margin: 0;
      color: #f8fafc;
      font-size: 20px;
    }

    .time-grid {
      display: grid;
      gap: 12px;
    }

    .time-item {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .time-item strong {
      display: block;
      color: #fbbf24;
      margin-bottom: 3px;
    }

    .time-item span {
      color: var(--muted);
      font-size: 14px;
    }

    .currentTime {
      font-size: clamp(30px, 5vw, 42px);
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--accent);
      margin: 8px 0 0;
    }

    @media (max-width: 820px) {
      .mapPanel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 World Time Zones</h1>

    <div class="panel">
      <div class="timezoneRadios" id="timezoneRadios"></div>

      <div class="mapPanel">
        <div class="mapWrap">
          <svg class="mapSvg" viewBox="0 0 800 420" role="img" aria-label="World map with timezone markers">
            <path d="M70 110 L120 95 L160 80 L200 95 L250 85 L280 95 L330 80 L360 100 L400 110 L420 140 L455 150 L490 170 L530 160 L560 180 L610 150 L670 170 L720 150 L745 200 L700 235 L710 280 L670 310 L625 300 L565 295 L540 325 L500 320 L470 345 L420 335 L390 300 L350 310 L310 290 L270 300 L220 275 L175 275 L150 250 L120 230 L90 195 L75 160 Z" fill="rgba(96,165,250,0.13)" stroke="rgba(96,165,250,0.35)" stroke-width="2"/>
            <circle cx="355" cy="165" r="25" fill="rgba(255,255,255,0.04)" />
            <circle cx="610" cy="150" r="25" fill="rgba(255,255,255,0.04)" />
            <circle cx="468" cy="300" r="22" fill="rgba(255,255,255,0.04)" />
            <circle cx="235" cy="220" r="18" fill="rgba(255,255,255,0.04)" />
          </svg>
          <div id="mapMarkers"></div>
        </div>

        <div class="timeCard">
          <div>
            <h2 id="selectedZoneLabel">UTC</h2>
            <div class="currentTime" id="selectedTime">--:--:--</div>
          </div>

          <div class="time-grid" id="timeList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  const WORLD_TIME_ZONES = [

      {
          city: "New Delhi",
          country: "India",
          timezone: "Asia/Kolkata",
          lat: 28.6139,
          lon: 77.2090
      },

      {
          city: "Dubai",
          country: "UAE",
          timezone: "Asia/Dubai",
          lat: 25.2048,
          lon: 55.2708
      },

      {
          city: "Singapore",
          country: "Singapore",
          timezone: "Asia/Singapore",
          lat: 1.3521,
          lon: 103.8198
      },

      {
          city: "Tokyo",
          country: "Japan",
          timezone: "Asia/Tokyo",
          lat: 35.6762,
          lon: 139.6503
      },

      {
          city: "Beijing",
          country: "China",
          timezone: "Asia/Shanghai",
          lat: 39.9042,
          lon: 116.4074
      },

      {
          city: "Sydney",
          country: "Australia",
          timezone: "Australia/Sydney",
          lat: -33.8688,
          lon: 151.2093
      },

      {
          city: "London",
          country: "UK",
          timezone: "Europe/London",
          lat: 51.5074,
          lon: -0.1278
      },

      {
          city: "Paris",
          country: "France",
          timezone: "Europe/Paris",
          lat: 48.8566,
          lon: 2.3522
      },

      {
          city: "Berlin",
          country: "Germany",
          timezone: "Europe/Berlin",
          lat: 52.5200,
          lon: 13.4050
      },

      {
          city: "New York",
          country: "USA",
          timezone: "America/New_York",
          lat: 40.7128,
          lon: -74.0060
      },

      {
          city: "Chicago",
          country: "USA",
          timezone: "America/Chicago",
          lat: 41.8781,
          lon: -87.6298
      },

      {
          city: "Denver",
          country: "USA",
          timezone: "America/Denver",
          lat: 39.7392,
          lon: -104.9903
      },

      {
          city: "Los Angeles",
          country: "USA",
          timezone: "America/Los_Angeles",
          lat: 34.0522,
          lon: -118.2437
      },

      {
          city: "Toronto",
          country: "Canada",
          timezone: "America/Toronto",
          lat: 43.6532,
          lon: -79.3832
      },

      {
          city: "São Paulo",
          country: "Brazil",
          timezone: "America/Sao_Paulo",
          lat: -23.5505,
          lon: -46.6333
      },

      {
          city: "Mexico City",
          country: "Mexico",
          timezone: "America/Mexico_City",
          lat: 19.4326,
          lon: -99.1332
      },

      {
          city: "Johannesburg",
          country: "South Africa",
          timezone: "Africa/Johannesburg",
          lat: -26.2041,
          lon: 28.0473
      },

      {
          city: "Cairo",
          country: "Egypt",
          timezone: "Africa/Cairo",
          lat: 30.0444,
          lon: 31.2357
      },

      {
          city: "Moscow",
          country: "Russia",
          timezone: "Europe/Moscow",
          lat: 55.7558,
          lon: 37.6173
      },

      {
          city: "Istanbul",
          country: "Turkey",
          timezone: "Europe/Istanbul",
          lat: 41.0082,
          lon: 28.9784
      },

      {
          city: "Riyadh",
          country: "Saudi Arabia",
          timezone: "Asia/Riyadh",
          lat: 24.7136,
          lon: 46.6753
      }

  ];


  // --------------------------------------------------
  // FORMAT TIME
  // --------------------------------------------------

  function formatTime(timezone) {

      return new Intl.DateTimeFormat("en-GB", {

          timeZone: timezone,

          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",

          hour12: false

      }).format(new Date());

  }


  // --------------------------------------------------
  // FORMAT DATE
  // --------------------------------------------------

  function formatDate(timezone) {

      return new Intl.DateTimeFormat("en-GB", {

          timeZone: timezone,

          weekday: "long",

          day: "2-digit",
          month: "long",
          year: "numeric"

      }).format(new Date());

  }


  // --------------------------------------------------
  // TIMEZONE NAME
  // --------------------------------------------------

  function getTimeZoneName(timezone) {

      try {

          return new Intl.DateTimeFormat("en-US", {

              timeZone: timezone,

              timeZoneName: "long"

          })
          .formatToParts(new Date())
          .find(
              part => part.type === "timeZoneName"
          )?.value || timezone;

      } catch (error) {

          return timezone;

      }

  }


  // --------------------------------------------------
  // CREATE RADIO BUTTONS
  // --------------------------------------------------

  function renderTimezoneRadios() {

      const container =
          document.getElementById("timezoneRadios");

      if (!container) {
          return;
      }

      container.innerHTML = "";

      WORLD_TIME_ZONES.forEach((zone, index) => {

          const label =
              document.createElement("label");

          label.className =
              "timezoneRadio";

          label.innerHTML = `

              <input
                  type="radio"
                  name="timezone"
                  value="${zone.timezone}"
                  ${index === 0 ? "checked" : ""}
              >

              <span>
                  ${zone.city}
              </span>

          `;

          const radio =
              label.querySelector("input");

          radio.addEventListener(
              "change",
              () => {

                  selectTimezone(
                      zone.timezone
                  );

              }
          );

          container.appendChild(label);

      });

  }


  // --------------------------------------------------
  // SELECT TIMEZONE
  // --------------------------------------------------

  function selectTimezone(timezone) {

      const zone =
          WORLD_TIME_ZONES.find(
              item =>
                  item.timezone === timezone
          );

      if (!zone) {
          return;
      }


      const selectedLabel =
          document.getElementById(
              "selectedZoneLabel"
          );

      const selectedTime =
          document.getElementById(
              "selectedTime"
          );

      const timeList =
          document.getElementById(
              "timeList"
          );


      if (selectedLabel) {

          selectedLabel.textContent =
              `${zone.city}, ${zone.country}`;

      }


      if (selectedTime) {

          selectedTime.textContent =
              formatTime(zone.timezone);

      }


      if (timeList) {

          timeList.innerHTML = `

              <div class="time-item">

                  <strong>Local Time</strong>

                  <span>
                      ${formatTime(zone.timezone)}
                  </span>

              </div>

              <div class="time-item">

                  <strong>Date</strong>

                  <span>
                      ${formatDate(zone.timezone)}
                  </span>

              </div>

              <div class="time-item">

                  <strong>Time Zone</strong>

                  <span>
                      ${getTimeZoneName(zone.timezone)}
                  </span>

              </div>

              <div class="time-item">

                  <strong>IANA Zone</strong>

                  <span>
                      ${zone.timezone}
                  </span>

              </div>

          `;

      }


      renderMapMarkers(
          zone.timezone
      );

  }


  // --------------------------------------------------
  // UPDATE SELECTED TIME
  // --------------------------------------------------

  function updateSelectedTime() {

      const selected =
          document.querySelector(
              'input[name="timezone"]:checked'
          );

      if (!selected) {
          return;
      }

      const selectedTime =
          document.getElementById(
              "selectedTime"
          );

      if (!selectedTime) {
          return;
      }

      selectedTime.textContent =
          formatTime(
              selected.value
          );


      const selectedZone =
          WORLD_TIME_ZONES.find(
              zone =>
                  zone.timezone ===
                  selected.value
          );

      if (selectedZone) {

          const timeList =
              document.getElementById(
                  "timeList"
              );

          if (timeList) {

              timeList.querySelector(
                  ".time-item:nth-child(1) span"
              ).textContent =
                  formatTime(
                      selectedZone.timezone
                  );

              timeList.querySelector(
                  ".time-item:nth-child(2) span"
              ).textContent =
                  formatDate(
                      selectedZone.timezone
                  );

              timeList.querySelector(
                  ".time-item:nth-child(3) span"
              ).textContent =
                  getTimeZoneName(
                      selectedZone.timezone
                  );

          }

      }

  }


  // --------------------------------------------------
  // MAP MARKERS
  // --------------------------------------------------

  function renderMapMarkers(
      selectedTimezone
  ) {

      const container =
          document.getElementById(
              "mapMarkers"
          );

      if (!container) {
          return;
      }

      container.innerHTML = "";


      WORLD_TIME_ZONES.forEach(zone => {

          // Convert longitude to percentage.
          // Map covers approximately -180 to +180.

          const left =
              ((zone.lon + 180) / 360) * 100;


          // Convert latitude to percentage.

          const top =
              ((90 - zone.lat) / 180) * 100;


          const marker =
              document.createElement("div");

          marker.className =
              "cityMarker";


          if (
              zone.timezone ===
              selectedTimezone
          ) {

              marker.classList.add(
                  "active"
              );

          }


          marker.style.left =
              `${left}%`;

          marker.style.top =
              `${top}%`;


          marker.title =
              `${zone.city} - ${formatTime(zone.timezone)}`;


          container.appendChild(marker);


          const label =
              document.createElement("div");

          label.className =
              "cityLabel";

          label.textContent =
              zone.city;


          label.style.left =
              `${left}%`;

          label.style.top =
              `${top}%`;


          container.appendChild(label);

      });

  }


  // --------------------------------------------------
  // INITIALIZE
  // --------------------------------------------------

  renderTimezoneRadios();

  selectTimezone(
      WORLD_TIME_ZONES[0].timezone
  );


  // --------------------------------------------------
  // UPDATE EVERY SECOND
  // --------------------------------------------------

  setInterval(
      updateSelectedTime,
      1000
  );

</script> 
</body>
</html>
